[platformio]
default_envs = native

[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter =
  +<classifier.cpp>
  +<auto_preset_controller.cpp>
build_flags =
  -std=c++17
  -I src
lib_deps =
  bblanchon/ArduinoJson @ ^7.4.3

[env:eval]
platform = native
build_src_filter =
  +<classifier.cpp>
  +<../tools/eval_cli.cpp>
build_flags =
  -std=c++17
  -O2
  -I src
lib_deps =
  bblanchon/ArduinoJson @ ^7.4.3
