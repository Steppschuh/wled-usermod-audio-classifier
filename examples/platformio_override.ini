# Example platformio_override.ini for compiling WLED with wled-usermod-audio-classifier
#
# Place or merge this in your root WLED repository directory before building.
# Note: AudioClassifier couples directly with AudioReactive for audio acquisition and frequency analysis.
# AudioReactive is included by default via ${env:esp32dev.custom_usermods}.

[platformio]
default_envs = esp32_audio_classifier

[env:esp32_audio_classifier]
extends = env:esp32dev
custom_usermods =
  ${env:esp32dev.custom_usermods}
  https://github.com/Steppschuh/wled-usermod-audio-classifier.git
