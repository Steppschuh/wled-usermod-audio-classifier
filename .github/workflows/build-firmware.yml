name: Build Firmware Binaries

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-native:
    name: Run Native Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Run Native Unit Tests
        run: |
          pio test -e native

  build-firmware:
    name: Build WLED Firmware (${{ matrix.env }})
    needs: test-native
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [esp32dev]

    env:
      WLED_REF: 6ee67dec94f3cd3fb2b85b81abb9de380b924c48

    steps:
      - name: Checkout Usermod Repo
        uses: actions/checkout@v7
        with:
          path: usermod-repo

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Cache PlatformIO
        uses: actions/cache@v6
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-pio-${{ matrix.env }}-${{ env.WLED_REF }}
          restore-keys: |
            ${{ runner.os }}-pio-${{ matrix.env }}-
            ${{ runner.os }}-pio-

      - name: Install PlatformIO and esptool
        run: |
          python -m pip install --upgrade pip
          pip install platformio esptool

      - name: Clone Pinned WLED Core
        run: |
          git clone https://github.com/wled/WLED.git wled-core
          cd wled-core
          git checkout ${{ env.WLED_REF }}

      - name: Configure Usermod via platformio_override.ini
        run: |
          cat <<EOF > wled-core/platformio_override.ini
          [platformio]
          default_envs = ${{ matrix.env }}

          [env:${{ matrix.env }}]
          custom_usermods =
            \${common.default_usermods}
            wled-usermod-audio-classifier = symlink://${{ github.workspace }}/usermod-repo
          EOF

      - name: Compile WLED Binary
        run: |
          cd wled-core
          pio run -e ${{ matrix.env }}

      - name: Package Firmware Binaries (OTA and Factory)
        run: |
          mkdir -p build_output
          BUILD_DIR="wled-core/.pio/build/${{ matrix.env }}"
          
          # 1. Copy OTA binary
          cp "${BUILD_DIR}/firmware.bin" "build_output/wled_audio_classifier_${{ matrix.env }}_ota.bin"

          # 2. Assemble factory binary (bootloader + partitions + boot_app0 + app at 0x0)
          if [ -f "${BUILD_DIR}/bootloader.bin" ] && [ -f "${BUILD_DIR}/partitions.bin" ]; then
            BOOT_APP0=$(find ~/.platformio/packages -name "boot_app0.bin" 2>/dev/null | head -n 1)
            if [ -n "$BOOT_APP0" ]; then
              esptool.py --chip esp32 merge-bin -o "build_output/wled_audio_classifier_${{ matrix.env }}_factory.bin" \
                --flash-mode dio --flash-size 4MB \
                0x1000 "${BUILD_DIR}/bootloader.bin" \
                0x8000 "${BUILD_DIR}/partitions.bin" \
                0xe000 "$BOOT_APP0" \
                0x10000 "${BUILD_DIR}/firmware.bin"
            fi
          fi

          # 3. Compute Checksums
          cd build_output
          sha256sum *.bin > SHA256SUMS

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wled_audio_classifier_${{ matrix.env }}
          path: build_output/*

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-firmware
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: release_artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release_artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
