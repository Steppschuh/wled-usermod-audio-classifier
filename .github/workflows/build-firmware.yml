name: Build Firmware Binaries

on:
  push:
    branches: [ main ]
    tags: [ 'v*', 'wled-*' ]
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:
    inputs:
      wled_ref:
        description: 'WLED git ref (tag, branch, or commit SHA)'
        required: false
        default: 'v16.0.1'
      release_tag:
        description: 'Optional tag for GitHub Release (e.g. wled-v16.0.1-mod-v0.1.0)'
        required: false
        default: ''
      release_title:
        description: 'Release Title'
        required: false
        default: ''
      release_body:
        description: 'Release Body'
        required: false
        default: ''
      prerelease:
        description: 'Publish as a GitHub prerelease'
        type: boolean
        required: false
        default: false
      target_commitish:
        description: 'Commitish (branch or SHA) that the release tag points to'
        type: string
        required: false
        default: ''
      generate_release_notes:
        description: 'Auto-generate release notes via GitHub'
        type: boolean
        required: false
        default: true
  workflow_call:
    inputs:
      wled_ref:
        type: string
        required: false
        default: 'v16.0.1'
      release_tag:
        type: string
        required: false
        default: ''
      release_title:
        type: string
        required: false
        default: ''
      release_body:
        type: string
        required: false
        default: ''
      prerelease:
        type: boolean
        required: false
        default: false
      target_commitish:
        type: string
        required: false
        default: ''
      generate_release_notes:
        type: boolean
        required: false
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  test-native:
    name: Run Native Unit Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Run Native Unit Tests
        run: |
          pio test -e native

      - name: Build & Run Suite Evaluation Gate
        run: |
          pio run -e eval
          python3 tools/evaluate.py --check-baseline test/baseline_scores.json --max-regression 1.5

  build-firmware:
    name: Build WLED Firmware (${{ matrix.env }})
    needs: test-native
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        env: [esp32dev]

    env:
      WLED_REF: ${{ inputs.wled_ref || 'v16.0.1' }}

    steps:
      - name: Checkout Usermod Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: usermod-repo
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.11'

      - name: Cache PlatformIO
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-pio-${{ matrix.env }}-${{ env.WLED_REF }}
          restore-keys: |
            ${{ runner.os }}-pio-${{ matrix.env }}-
            ${{ runner.os }}-pio-

      - name: Install PlatformIO and esptool
        run: |
          python -m pip install --upgrade pip
          pip install platformio esptool

      - name: Clone Pinned WLED Core
        env:
          INPUT_WLED_REF: ${{ inputs.wled_ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          TARGET_REF="${WLED_REF}"
          if [ -z "${INPUT_WLED_REF}" ] && [[ "${REF_NAME}" =~ wled-(v?[0-9a-zA-Z.-]+)-mod- ]]; then
            TARGET_REF="${BASH_REMATCH[1]}"
            echo "Resolved WLED ref from tag: ${TARGET_REF}"
          fi
          echo "Cloning WLED at ref: ${TARGET_REF}"
          git clone https://github.com/wled/WLED.git wled-core
          cd wled-core
          git checkout "${TARGET_REF}"

      - name: Configure Usermod via platformio_override.ini
        env:
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
          REF_NAME: ${{ github.ref_name }}
          MATRIX_ENV: ${{ matrix.env }}
        run: |
          USERMOD_VERSION=$(jq -r '.version // "0.1.0"' usermod-repo/library.json)
          USERMOD_TAG="v${USERMOD_VERSION#v}"
          
          # Determine release tag (e.g. wled-v16.0.1-mod-v0.1.0)
          if [ -n "${INPUT_RELEASE_TAG}" ]; then
            TAG="${INPUT_RELEASE_TAG}"
          elif [[ "${REF_NAME}" =~ ^(v|wled-) ]]; then
            TAG="${REF_NAME}"
          else
            WLED_TAG_PART="${WLED_REF#v}"
            TAG="wled-v${WLED_TAG_PART}-mod-${USERMOD_TAG}"
          fi
          echo "RELEASE_TAG=${TAG}" >> "$GITHUB_ENV"

          cat <<EOF > wled-core/platformio_override.ini
          [platformio]
          default_envs = ${MATRIX_ENV}

          [common]
          default_usermods = audioreactive

          [env:${MATRIX_ENV}]
          custom_usermods =
            \${common.default_usermods}
            wled-usermod-audio-classifier = symlink://${GITHUB_WORKSPACE}/usermod-repo
          EOF

      - name: Compile WLED Binary
        env:
          MATRIX_ENV: ${{ matrix.env }}
        run: |
          cd wled-core
          pio run -e "${MATRIX_ENV}"

      - name: Package Firmware Binaries (OTA and Factory)
        env:
          MATRIX_ENV: ${{ matrix.env }}
        run: |
          mkdir -p build_output
          BUILD_DIR="wled-core/.pio/build/${MATRIX_ENV}"
          USERMOD_VERSION=$(jq -r '.version // "0.1.0"' usermod-repo/library.json)
          USERMOD_CLEAN="${USERMOD_VERSION#v}"

          # Extract clean WLED version (e.g. 16.0.1 or 17.0.0-devV5)
          if [[ "${RELEASE_TAG}" =~ wled-v?([0-9a-zA-Z.-]+)-mod- ]]; then
            WLED_CLEAN="${BASH_REMATCH[1]}"
          elif [[ "${WLED_REF}" =~ ^v?[0-9] ]]; then
            WLED_CLEAN="${WLED_REF#v}"
          else
            WLED_CLEAN=$(git -C wled-core describe --tags --always 2>/dev/null | sed 's/^v//' || echo "dev")
          fi
          WLED_CLEAN="${WLED_CLEAN#v}"

          # Map PlatformIO environment to official WLED board target naming
          case "${MATRIX_ENV}" in
            esp32dev) TARGET="ESP32" ;;
            esp32_c3*) TARGET="ESP32-C3" ;;
            esp32_s3*) TARGET="ESP32-S3" ;;
            esp8266*) TARGET="ESP8266" ;;
            *) TARGET=$(echo "${MATRIX_ENV}" | tr '[:lower:]' '[:upper:]') ;;
          esac

          # Official WLED release naming convention: WLED_<WLED_VER>_MOD_<USERMOD_VER>_<TARGET>.bin
          BASE_NAME="WLED_${WLED_CLEAN}_MOD_${USERMOD_CLEAN}_${TARGET}"
          echo "Packaging artifacts with base name: ${BASE_NAME}"

          # 1. Copy main OTA binary
          cp "${BUILD_DIR}/firmware.bin" "build_output/${BASE_NAME}.bin"

          # 2. Assemble factory binary (bootloader + partitions + boot_app0 + app at 0x0)
          if [ -f "${BUILD_DIR}/bootloader.bin" ] && [ -f "${BUILD_DIR}/partitions.bin" ]; then
            BOOT_APP0=$(find ~/.platformio/packages -name "boot_app0.bin" 2>/dev/null | head -n 1)
            if [ -n "$BOOT_APP0" ]; then
              esptool.py --chip esp32 merge-bin -o "build_output/${BASE_NAME}_factory.bin" \
                --flash-mode dio --flash-size 4MB \
                0x1000 "${BUILD_DIR}/bootloader.bin" \
                0x8000 "${BUILD_DIR}/partitions.bin" \
                0xe000 "$BOOT_APP0" \
                0x10000 "${BUILD_DIR}/firmware.bin"
            fi
          fi

          # 3. Compute Checksums
          cd build_output
          sha256sum *.bin > SHA256SUMS

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: wled_audio_classifier_${{ matrix.env }}
          path: build_output/*

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/wled-') || (inputs.release_tag != '' && inputs.release_tag != null)
    needs: build-firmware
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: release_artifacts
          merge-multiple: true

      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        continue-on-error: true
        with:
          subject-path: "release_artifacts/*"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ inputs.target_commitish || github.sha }}
          name: ${{ inputs.release_title || inputs.release_tag || github.ref_name }}
          body: ${{ inputs.release_body || '' }}
          prerelease: ${{ inputs.prerelease || false }}
          generate_release_notes: ${{ inputs.generate_release_notes != false }}
          files: release_artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
