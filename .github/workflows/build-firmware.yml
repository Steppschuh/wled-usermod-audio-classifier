name: Build Firmware Binaries

on:
  push:
    branches: [ main ]
    tags: [ 'v*', 'wled-*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      wled_ref:
        description: 'WLED git ref (tag, branch, or commit SHA)'
        required: false
        default: '6ee67dec94f3cd3fb2b85b81abb9de380b924c48'
      release_tag:
        description: 'Optional tag for GitHub Release (e.g. wled-v16.0.1-mod-v0.1.0)'
        required: false
        default: ''
      release_title:
        description: 'Release Title'
        required: false
        default: ''
      release_body:
        description: 'Release Body'
        required: false
        default: ''
  workflow_call:
    inputs:
      wled_ref:
        type: string
        required: false
        default: '6ee67dec94f3cd3fb2b85b81abb9de380b924c48'
      release_tag:
        type: string
        required: false
        default: ''
      release_title:
        type: string
        required: false
        default: ''
      release_body:
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:
  test-native:
    name: Run Native Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Run Native Unit Tests
        run: |
          pio test -e native

  build-firmware:
    name: Build WLED Firmware (${{ matrix.env }})
    needs: test-native
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [esp32dev]

    env:
      WLED_REF: ${{ inputs.wled_ref || '6ee67dec94f3cd3fb2b85b81abb9de380b924c48' }}

    steps:
      - name: Checkout Usermod Repo
        uses: actions/checkout@v7
        with:
          path: usermod-repo

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Cache PlatformIO
        uses: actions/cache@v6
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-pio-${{ matrix.env }}-${{ env.WLED_REF }}
          restore-keys: |
            ${{ runner.os }}-pio-${{ matrix.env }}-
            ${{ runner.os }}-pio-

      - name: Install PlatformIO and esptool
        run: |
          python -m pip install --upgrade pip
          pip install platformio esptool

      - name: Clone Pinned WLED Core
        run: |
          git clone https://github.com/wled/WLED.git wled-core
          cd wled-core
          git checkout ${{ env.WLED_REF }}

      - name: Configure Usermod via platformio_override.ini
        run: |
          USERMOD_VERSION=$(jq -r '.version // "0.1.0"' usermod-repo/library.json)
          USERMOD_TAG="v${USERMOD_VERSION#v}"
          
          # Determine release tag (e.g. wled-v16.0.1-mod-v0.1.0)
          if [ -n "${{ inputs.release_tag }}" ]; then
            TAG="${{ inputs.release_tag }}"
          elif [[ "${{ github.ref_name }}" =~ ^(v|wled-) ]]; then
            TAG="${{ github.ref_name }}"
          else
            WLED_TAG_PART="${WLED_REF#v}"
            TAG="wled-v${WLED_TAG_PART}-mod-${USERMOD_TAG}"
          fi
          echo "RELEASE_TAG=${TAG}" >> $GITHUB_ENV

          cat <<EOF > wled-core/platformio_override.ini
          [platformio]
          default_envs = ${{ matrix.env }}

          [common]
          default_usermods = audioreactive

          [env:${{ matrix.env }}]
          build_flags =
            \${env.build_flags}
            -D AUDIO_CLASSIFIER_RELEASE_TAG='\"${TAG}\"'
          custom_usermods =
            \${common.default_usermods}
            wled-usermod-audio-classifier = symlink://${{ github.workspace }}/usermod-repo
          EOF

      - name: Compile WLED Binary
        run: |
          cd wled-core
          pio run -e ${{ matrix.env }}

      - name: Package Firmware Binaries (OTA and Factory)
        run: |
          mkdir -p build_output
          BUILD_DIR="wled-core/.pio/build/${{ matrix.env }}"
          USERMOD_VERSION=$(jq -r '.version // "0.1.0"' usermod-repo/library.json)
          USERMOD_CLEAN="${USERMOD_VERSION#v}"

          # Extract clean WLED version (e.g. 16.0.1 or 17.0.0-devV5)
          if [[ "${{ env.RELEASE_TAG }}" =~ wled-v?([0-9a-zA-Z.-]+)-mod- ]]; then
            WLED_CLEAN="${BASH_REMATCH[1]}"
          elif [[ "${{ env.WLED_REF }}" =~ ^v?[0-9] ]]; then
            WLED_CLEAN="${WLED_REF#v}"
          else
            WLED_CLEAN=$(git -C wled-core describe --tags --always 2>/dev/null | sed 's/^v//' || echo "dev")
          fi
          WLED_CLEAN="${WLED_CLEAN#v}"

          # Map PlatformIO environment to official WLED board target naming
          case "${{ matrix.env }}" in
            esp32dev) TARGET="ESP32" ;;
            esp32_c3*) TARGET="ESP32-C3" ;;
            esp32_s3*) TARGET="ESP32-S3" ;;
            esp8266*) TARGET="ESP8266" ;;
            *) TARGET=$(echo "${{ matrix.env }}" | tr '[:lower:]' '[:upper:]') ;;
          esac

          # Official WLED release naming convention: WLED_<WLED_VER>_MOD_<USERMOD_VER>_<TARGET>.bin
          BASE_NAME="WLED_${WLED_CLEAN}_MOD_${USERMOD_CLEAN}_${TARGET}"
          echo "Packaging artifacts with base name: ${BASE_NAME}"

          # 1. Copy main OTA binary
          cp "${BUILD_DIR}/firmware.bin" "build_output/${BASE_NAME}.bin"

          # 2. Assemble factory binary (bootloader + partitions + boot_app0 + app at 0x0)
          if [ -f "${BUILD_DIR}/bootloader.bin" ] && [ -f "${BUILD_DIR}/partitions.bin" ]; then
            BOOT_APP0=$(find ~/.platformio/packages -name "boot_app0.bin" 2>/dev/null | head -n 1)
            if [ -n "$BOOT_APP0" ]; then
              esptool.py --chip esp32 merge-bin -o "build_output/${BASE_NAME}_factory.bin" \
                --flash-mode dio --flash-size 4MB \
                0x1000 "${BUILD_DIR}/bootloader.bin" \
                0x8000 "${BUILD_DIR}/partitions.bin" \
                0xe000 "$BOOT_APP0" \
                0x10000 "${BUILD_DIR}/firmware.bin"
            fi
          fi

          # 3. Compute Checksums
          cd build_output
          sha256sum *.bin > SHA256SUMS

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wled_audio_classifier_${{ matrix.env }}
          path: build_output/*

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/wled-') || (inputs.release_tag != '' && inputs.release_tag != null)
    needs: build-firmware
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: release_artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          name: ${{ inputs.release_title || inputs.release_tag || github.ref_name }}
          body: ${{ inputs.release_body || '' }}
          files: release_artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
