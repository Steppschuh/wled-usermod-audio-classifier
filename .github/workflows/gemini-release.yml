name: '🚀 Gemini Release PR'

on:
  workflow_dispatch:
    inputs:
      source_branch:
        description: 'Source branch with unreleased changes'
        type: 'string'
        required: false
        default: 'dev'
      target_branch:
        description: 'Target branch for the release PR'
        type: 'string'
        required: false
        default: 'main'
      version_override:
        description: 'Optional explicit SemVer version (e.g. 0.3.1); leave blank for auto-bump'
        type: 'string'
        required: false
        default: ''
  workflow_call:
    inputs:
      source_branch:
        description: 'Source branch with unreleased changes'
        type: 'string'
        required: false
        default: 'dev'
      target_branch:
        description: 'Target branch for the release PR'
        type: 'string'
        required: false
        default: 'main'
      version_override:
        description: 'Optional explicit SemVer version (e.g. 0.3.1); leave blank for auto-bump'
        type: 'string'
        required: false
        default: ''

concurrency:
  group: '${{ github.workflow }}-${{ inputs.source_branch || ''dev'' }}-${{ inputs.target_branch || ''main'' }}'
  cancel-in-progress: false

defaults:
  run:
    shell: 'bash'

jobs:
  prepare-release:
    name: 'Prepare Release PR with Gemini CLI'
    timeout-minutes: 30
    runs-on: 'ubuntu-latest'
    permissions:
      contents: 'write'
      id-token: 'write'
      issues: 'read'
      pull-requests: 'write'

    steps:
      - name: 'Mint identity token'
        id: 'mint_identity_token'
        if: |-
          ${{ vars.APP_ID }}
        uses: 'actions/create-github-app-token@29824e69f54612133e76f7eaac726eef6c875baf'
        with:
          app-id: '${{ vars.APP_ID }}'
          private-key: '${{ secrets.APP_PRIVATE_KEY }}'
          permission-contents: 'write'
          permission-issues: 'read'
          permission-pull-requests: 'write'

      - name: 'Checkout Source Branch'
        uses: 'actions/checkout@v7'
        with:
          ref: '${{ inputs.source_branch || ''dev'' }}'
          fetch-depth: 0
          token: '${{ steps.mint_identity_token.outputs.token || secrets.GITHUB_TOKEN || github.token }}'
          persist-credentials: true

      - name: 'Prepare Release Context'
        id: 'prep'
        env:
          GH_TOKEN: '${{ steps.mint_identity_token.outputs.token || secrets.GITHUB_TOKEN || github.token }}'
          SOURCE_BRANCH: '${{ inputs.source_branch || ''dev'' }}'
          TARGET_BRANCH: '${{ inputs.target_branch || ''main'' }}'
          VERSION_OVERRIDE: '${{ inputs.version_override || '''' }}'
          REPOSITORY: '${{ github.repository }}'
        run: |-
          set -euo pipefail

          git fetch origin "${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}" --tags

          # Resolve the latest non-prerelease tagged release reachable on target_branch
          BASE_REF=""
          RELEASE_TAGS=$(gh release list --repo "${REPOSITORY}" --exclude-drafts --exclude-pre-releases --limit 25 --json tagName --jq '.[].tagName' 2>/dev/null || true)
          if [[ -n "${RELEASE_TAGS}" ]]; then
            while IFS= read -r tag; do
              [[ -z "${tag}" ]] && continue
              if git rev-parse --verify "refs/tags/${tag}" >/dev/null 2>&1 && \
                 git merge-base --is-ancestor "refs/tags/${tag}" "origin/${TARGET_BRANCH}" >/dev/null 2>&1; then
                BASE_REF="${tag}"
                break
              fi
            done <<< "${RELEASE_TAGS}"
          fi

          if [[ -z "${BASE_REF}" ]]; then
            BASE_REF=$(git describe --tags --abbrev=0 \
              --exclude='*-dev.*' \
              --exclude='*-rc.*' \
              --exclude='*-alpha.*' \
              --exclude='*-beta.*' \
              "origin/${TARGET_BRANCH}" 2>/dev/null || true)
          fi

          if [[ -n "${BASE_REF}" ]]; then
            COMPARE_REF="refs/tags/${BASE_REF}"
            BASE_REF_TYPE="release_tag"
          else
            COMPARE_REF="origin/${TARGET_BRANCH}"
            BASE_REF="${TARGET_BRANCH}"
            BASE_REF_TYPE="branch"
          fi

          COMMIT_COUNT=$(git rev-list --count "${COMPARE_REF}..HEAD")
          if [[ "${COMMIT_COUNT}" -eq 0 ]]; then
            echo "::notice::No commits on ${SOURCE_BRANCH} ahead of ${BASE_REF}. Skipping release PR."
            echo "has_changes=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          echo "has_changes=true" >> "${GITHUB_OUTPUT}"
          echo "base_ref=${BASE_REF}" >> "${GITHUB_OUTPUT}"

          CURRENT_VERSION=$(jq -r '.version // "0.0.0"' library.json)
          RELEASE_DATE=$(date -u +%Y-%m-%d)
          echo "current_version=${CURRENT_VERSION}" >> "${GITHUB_OUTPUT}"
          echo "release_date=${RELEASE_DATE}" >> "${GITHUB_OUTPUT}"

          COMMITS=$(git log --pretty=format:'%h %s (%an)' "${COMPARE_REF}..HEAD")
          CHANGED_FILES=$(git diff --name-status "${COMPARE_REF}...HEAD")
          DIFF_STAT=$(git diff --stat "${COMPARE_REF}...HEAD")
          MERGED_PRS=$(gh pr list --repo "${REPOSITORY}" --state merged --limit 30 --json number,title,url,baseRefName,headRefName,mergedAt 2>/dev/null || echo "[]")

          mkdir -p .gemini
          git diff "${COMPARE_REF}...HEAD" -- . ':(exclude)test/fixtures/*.json' > .gemini/release-diff.patch || true

          jq -n \
            --arg source_branch "${SOURCE_BRANCH}" \
            --arg target_branch "${TARGET_BRANCH}" \
            --arg base_ref "${BASE_REF}" \
            --arg compare_ref "${COMPARE_REF}" \
            --arg base_ref_type "${BASE_REF_TYPE}" \
            --arg current_version "${CURRENT_VERSION}" \
            --arg version_override "${VERSION_OVERRIDE}" \
            --arg release_date "${RELEASE_DATE}" \
            --arg commit_count "${COMMIT_COUNT}" \
            --arg commits "${COMMITS}" \
            --arg changed_files "${CHANGED_FILES}" \
            --arg diff_stat "${DIFF_STAT}" \
            --arg diff_patch_path ".gemini/release-diff.patch" \
            --arg repository "${REPOSITORY}" \
            --argjson merged_prs "${MERGED_PRS}" \
            '{
              source_branch: $source_branch,
              target_branch: $target_branch,
              base_ref: $base_ref,
              compare_ref: $compare_ref,
              base_ref_type: $base_ref_type,
              current_version: $current_version,
              version_override: $version_override,
              release_date: $release_date,
              commit_count: $commit_count,
              commits_since_base: $commits,
              changed_files: $changed_files,
              diff_stat: $diff_stat,
              diff_patch_path: $diff_patch_path,
              repository: $repository,
              merged_prs: $merged_prs
            }' > .gemini/release-context.json

      - name: 'Run Gemini CLI'
        id: 'run_gemini'
        if: |-
          ${{ steps.prep.outputs.has_changes == 'true' }}
        uses: 'google-github-actions/run-gemini-cli@v0'
        env:
          GEMINI_CLI_TRUST_WORKSPACE: 'true'
          GITHUB_TOKEN: '${{ steps.mint_identity_token.outputs.token || secrets.GITHUB_TOKEN || github.token }}'
        with:
          gcp_location: '${{ vars.GOOGLE_CLOUD_LOCATION }}'
          gcp_project_id: '${{ vars.GOOGLE_CLOUD_PROJECT }}'
          gcp_service_account: '${{ vars.SERVICE_ACCOUNT_EMAIL }}'
          gcp_workload_identity_provider: '${{ vars.GCP_WIF_PROVIDER }}'
          gemini_api_key: '${{ secrets.GEMINI_API_KEY }}'
          gemini_cli_version: '${{ vars.GEMINI_CLI_VERSION }}'
          gemini_debug: '${{ fromJSON(vars.GEMINI_DEBUG || vars.ACTIONS_STEP_DEBUG || false) }}'
          gemini_model: '${{ vars.GEMINI_MODEL }}'
          google_api_key: '${{ secrets.GOOGLE_API_KEY }}'
          use_gemini_code_assist: '${{ vars.GOOGLE_GENAI_USE_GCA }}'
          use_vertex_ai: '${{ vars.GOOGLE_GENAI_USE_VERTEXAI }}'
          upload_artifacts: '${{ vars.UPLOAD_ARTIFACTS }}'
          workflow_name: 'gemini-release'
          settings: |-
            {
              "model": {
                "maxSessionTurns": 25
              },
              "telemetry": {
                "enabled": true,
                "target": "local",
                "outfile": ".gemini/telemetry.log"
              },
              "mcpServers": {
                "github": {
                  "command": "docker",
                  "args": [
                    "run",
                    "-i",
                    "--rm",
                    "-e",
                    "GITHUB_PERSONAL_ACCESS_TOKEN",
                    "ghcr.io/github/github-mcp-server:v0.27.0"
                  ],
                  "includeTools": [
                    "pull_request_read",
                    "list_pull_requests",
                    "search_pull_requests",
                    "issue_read",
                    "list_issues",
                    "search_issues",
                    "get_commit",
                    "get_file_contents",
                    "list_commits",
                    "search_code"
                  ],
                  "env": {
                    "GITHUB_PERSONAL_ACCESS_TOKEN": "${GITHUB_TOKEN}"
                  }
                }
              },
              "tools": {
                "core": [
                  "read_file"
                ]
              }
            }
          prompt: '/gemini-release'

      - name: 'Apply Release Changes, Push Branch & Open PR'
        if: |-
          ${{ steps.prep.outputs.has_changes == 'true' }}
        env:
          GH_TOKEN: '${{ steps.mint_identity_token.outputs.token || secrets.GITHUB_TOKEN || github.token }}'
          GEMINI_SUMMARY: '${{ steps.run_gemini.outputs.summary }}'
          SOURCE_BRANCH: '${{ inputs.source_branch || ''dev'' }}'
          TARGET_BRANCH: '${{ inputs.target_branch || ''main'' }}'
          BASE_REF: '${{ steps.prep.outputs.base_ref }}'
          CURRENT_VERSION: '${{ steps.prep.outputs.current_version }}'
          RELEASE_DATE: '${{ steps.prep.outputs.release_date }}'
          REPOSITORY: '${{ github.repository }}'
        run: |-
          set -euo pipefail

          echo "=== Gemini CLI Output ==="
          printf '%s\n' "${GEMINI_SUMMARY}"
          echo "========================="

          rm -f .gemini/release-context.json .gemini/release-diff.patch

          python3 - <<'PYEOF'
          import json
          import os
          import re
          import sys

          raw = os.environ.get("GEMINI_SUMMARY", "").strip()
          if not raw:
            print("::error::Gemini CLI returned an empty summary.", file=sys.stderr)
            sys.exit(1)

          start = raw.find("{")
          end = raw.rfind("}")
          if start == -1 or end == -1 or end <= start:
            print("::error::Gemini CLI summary did not contain a valid JSON object.", file=sys.stderr)
            sys.exit(1)

          try:
            data = json.loads(raw[start : end + 1])
          except json.JSONDecodeError as exc:
            print(f"::error::Failed to parse Gemini CLI JSON: {exc}", file=sys.stderr)
            sys.exit(1)

          skip_reason = str(data.get("skip_reason") or "").strip()
          if skip_reason:
            print(f"::notice::Release skipped by Gemini CLI: {skip_reason}")
            with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as fh:
              fh.write("RELEASE_SKIPPED=true\n")
            sys.exit(0)

          new_version = str(data.get("new_version") or "").strip().lstrip("v")
          if not re.match(r"^[0-9]+\.[0-9]+\.[0-9]+$", new_version):
            print(f"::error::Invalid SemVer version from Gemini: {new_version!r}", file=sys.stderr)
            sys.exit(1)

          current_version = os.environ["CURRENT_VERSION"].strip().lstrip("v")
          if new_version == current_version:
            print(f"::error::New version ({new_version}) matches current version ({current_version}).", file=sys.stderr)
            sys.exit(1)

          changelog_sections = str(data.get("changelog_sections") or "").strip()
          if not changelog_sections:
            print("::error::Gemini CLI returned empty changelog_sections.", file=sys.stderr)
            sys.exit(1)

          bump_type = str(data.get("bump_type") or "release").strip()
          rationale = str(data.get("rationale") or "").strip()
          pr_title = str(data.get("pr_title") or f"chore(release): v{new_version}").replace("\r", " ").replace("\n", " ").strip()
          pr_summary = str(data.get("pr_summary") or "").strip()
          release_date = os.environ["RELEASE_DATE"]
          source_branch = os.environ["SOURCE_BRANCH"]
          base_ref = os.environ["BASE_REF"]
          target_branch = os.environ["TARGET_BRANCH"]

          # 1. Update library.json
          with open("library.json", "r", encoding="utf-8") as fh:
            lib = json.load(fh)
          lib["version"] = new_version
          with open("library.json", "w", encoding="utf-8") as fh:
            json.dump(lib, fh, indent=2)
            fh.write("\n")

          # 2. Update src/ha_discovery.h
          with open("src/ha_discovery.h", "r", encoding="utf-8") as fh:
            ha_hdr = fh.read()
          updated_hdr, count = re.subn(
            r'(#define\s+USERMOD_AUDIO_CLASSIFIER_VERSION\s+)"[^"]+"',
            rf'\1"{new_version}"',
            ha_hdr,
          )
          if count != 1:
            print("::error::Failed to update USERMOD_AUDIO_CLASSIFIER_VERSION in src/ha_discovery.h", file=sys.stderr)
            sys.exit(1)
          with open("src/ha_discovery.h", "w", encoding="utf-8") as fh:
            fh.write(updated_hdr)

          # 3. Update CHANGELOG.md
          with open("CHANGELOG.md", "r", encoding="utf-8") as fh:
            changelog = fh.read()
          release_block = f"## [{new_version}] - {release_date}\n\n{changelog_sections}"
          marker = "## [Unreleased]"
          idx = changelog.find(marker)
          if idx == -1:
            print("::error::Could not find '## [Unreleased]' marker in CHANGELOG.md", file=sys.stderr)
            sys.exit(1)
          after_marker = idx + len(marker)
          head = changelog[:after_marker]
          tail = changelog[after_marker:].lstrip("\r\n")
          updated_changelog = f"{head}\n\n{release_block}\n\n{tail}"
          with open("CHANGELOG.md", "w", encoding="utf-8") as fh:
            fh.write(updated_changelog)

          pr_body_lines = [
            f"## Release v{new_version}",
            "",
          ]
          if pr_summary:
            pr_body_lines.extend([pr_summary, ""])
          pr_body_lines.extend([
            f"- **Version Bump**: `{current_version}` → `{new_version}` ({bump_type})",
            f"- **Bump Rationale**: {rationale}",
            f"- **Diff Scope**: `{source_branch}` vs `{base_ref}`",
            "- **Updated Files**: `library.json`, `src/ha_discovery.h`, `CHANGELOG.md`",
            "",
            "### Changelog",
            changelog_sections,
            "",
            "---",
            f"Merging this PR into `{target_branch}` will automatically trigger `.github/workflows/sync-wled-releases.yml` to build and publish the GitHub release.",
          ])
          pr_body = "\n".join(pr_body_lines) + "\n"
          with open("/tmp/release-pr-body.md", "w", encoding="utf-8") as fh:
            fh.write(pr_body)

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as fh:
            fh.write(f"NEW_VERSION={new_version}\n")
            fh.write(f"PR_TITLE={pr_title}\n")
            fh.write("RELEASE_SKIPPED=false\n")
          PYEOF

          if [[ "${RELEASE_SKIPPED:-true}" == "true" ]]; then
            exit 0
          fi

          RELEASE_BRANCH="release/${NEW_VERSION}"
          if git ls-remote --exit-code --heads origin "${RELEASE_BRANCH}" >/dev/null 2>&1; then
            echo "::error::Remote branch ${RELEASE_BRANCH} already exists. Delete it or bump to a different version."
            exit 1
          fi

          jq empty library.json
          git status --short

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -b "${RELEASE_BRANCH}"
          git add library.json src/ha_discovery.h CHANGELOG.md
          git commit -m "chore(release): prepare v${NEW_VERSION}"
          git push -u origin "${RELEASE_BRANCH}"

          PR_URL=$(gh pr create \
            --repo "${REPOSITORY}" \
            --base "${TARGET_BRANCH}" \
            --head "${RELEASE_BRANCH}" \
            --title "${PR_TITLE}" \
            --body-file /tmp/release-pr-body.md)

          echo "Created release PR: ${PR_URL}"
          if [[ -n "${GITHUB_STEP_SUMMARY:-}" ]]; then
            echo "### Release PR Created" >> "${GITHUB_STEP_SUMMARY}"
            echo "- Branch: \`${RELEASE_BRANCH}\` → \`${TARGET_BRANCH}\`" >> "${GITHUB_STEP_SUMMARY}"
            echo "- PR: ${PR_URL}" >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: 'Cleanup Temporary Release Context'
        if: always()
        run: rm -f .gemini/release-context.json .gemini/release-diff.patch /tmp/release-pr-body.md
