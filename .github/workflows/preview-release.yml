name: Publish Dev Preview Release

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare-preview:
    name: Prepare Preview Metadata
    runs-on: ubuntu-latest
    outputs:
      wled_tag: ${{ steps.meta.outputs.wled_tag }}
      release_tag: ${{ steps.meta.outputs.release_tag }}
      usermod_tag: ${{ steps.meta.outputs.usermod_tag }}
      short_sha: ${{ steps.meta.outputs.short_sha }}
      target_commitish: ${{ steps.meta.outputs.target_commitish }}
      branch_name: ${{ steps.meta.outputs.branch_name }}
      branch_slug: ${{ steps.meta.outputs.branch_slug }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7

      - name: Resolve Preview Version & Tag
        id: meta
        run: |
          WLED_TAG=$(gh api repos/wled/WLED/releases/latest --jq .tag_name 2>/dev/null || echo "6ee67dec94f3cd3fb2b85b81abb9de380b924c48")
          USERMOD_VERSION=$(jq -r '.version // "0.1.0"' library.json)
          USERMOD_TAG="v${USERMOD_VERSION#v}"
          SHORT_SHA=$(git rev-parse --short HEAD)
          BRANCH_NAME="${GITHUB_REF_NAME}"
          BRANCH_SLUG=$(printf '%s' "${BRANCH_NAME}" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9_-]/-/g')
          RELEASE_TAG="wled-${WLED_TAG}-mod-${USERMOD_TAG}-${BRANCH_SLUG}.${GITHUB_RUN_NUMBER}"

          echo "wled_tag=${WLED_TAG}" >> "$GITHUB_OUTPUT"
          echo "usermod_tag=${USERMOD_TAG}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "target_commitish=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "branch_name=${BRANCH_NAME}" >> "$GITHUB_OUTPUT"
          echo "branch_slug=${BRANCH_SLUG}" >> "$GITHUB_OUTPUT"
          echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-and-preview-release:
    name: Build & Publish Preview Release
    needs: prepare-preview
    uses: ./.github/workflows/build-firmware.yml
    with:
      wled_ref: ${{ needs.prepare-preview.outputs.wled_tag }}
      release_tag: ${{ needs.prepare-preview.outputs.release_tag }}
      target_commitish: ${{ needs.prepare-preview.outputs.target_commitish }}
      release_title: "WLED ${{ needs.prepare-preview.outputs.wled_tag }} with Audio Classifier ${{ needs.prepare-preview.outputs.usermod_tag }}-${{ needs.prepare-preview.outputs.branch_slug }}.${{ github.run_number }} (${{ needs.prepare-preview.outputs.short_sha }})"
      release_body: |
        Automated **${{ needs.prepare-preview.outputs.branch_name }} preview** build from `${{ needs.prepare-preview.outputs.branch_name }}` commit `${{ needs.prepare-preview.outputs.short_sha }}`, bundling **wled-usermod-audio-classifier ${{ needs.prepare-preview.outputs.usermod_tag }}** with **WLED [${{ needs.prepare-preview.outputs.wled_tag }}](https://github.com/wled/WLED/releases/tag/${{ needs.prepare-preview.outputs.wled_tag }})**.

        > [!WARNING]
        > This is a pre-release preview build from the `${{ needs.prepare-preview.outputs.branch_name }}` branch intended for testing.
      prerelease: true
    secrets: inherit

  cleanup-old-previews:
    name: Delete Older Preview Releases & Tags
    needs:
      - prepare-preview
      - build-and-preview-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Delete older preview releases and tags from same branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          CURRENT_TAG: ${{ needs.prepare-preview.outputs.release_tag }}
          BRANCH_NAME: ${{ needs.prepare-preview.outputs.branch_name }}
          BRANCH_SLUG: ${{ needs.prepare-preview.outputs.branch_slug }}
        run: |
          set -euo pipefail

          OLD_RELEASE_TAGS=$(gh api --paginate "repos/${REPOSITORY}/releases" | jq -r \
            --arg current "${CURRENT_TAG}" \
            --arg branch "${BRANCH_NAME}" \
            --arg slug "${BRANCH_SLUG}" \
            '.[] | select(
              .prerelease == true
              and .tag_name != $current
              and (
                (.tag_name | test("^wled-.*-mod-v.*-" + $slug + "\\.[0-9]+$"))
                or (.target_commitish == $branch)
                or ((.body // "") | contains("from `" + $branch + "` commit"))
              )
            ) | .tag_name')

          if [[ -n "${OLD_RELEASE_TAGS}" ]]; then
            while IFS= read -r tag; do
              [[ -z "${tag}" ]] && continue
              echo "Deleting older preview release and tag: ${tag}"
              gh release delete "${tag}" --repo "${REPOSITORY}" --yes --cleanup-tag || \
                gh release delete "${tag}" --repo "${REPOSITORY}" --yes || true
              gh api -X DELETE "repos/${REPOSITORY}/git/refs/tags/${tag}" 2>/dev/null || true
            done <<< "${OLD_RELEASE_TAGS}"
          else
            echo "No older preview releases found for branch ${BRANCH_NAME}."
          fi

          LEFTOVER_TAGS=$(gh api --paginate "repos/${REPOSITORY}/tags" | jq -r \
            --arg current "${CURRENT_TAG}" \
            --arg slug "${BRANCH_SLUG}" \
            '.[] | select(
              .name != $current
              and (.name | test("^wled-.*-mod-v.*-" + $slug + "\\.[0-9]+$"))
            ) | .name')

          if [[ -n "${LEFTOVER_TAGS}" ]]; then
            while IFS= read -r tag; do
              [[ -z "${tag}" ]] && continue
              echo "Deleting leftover preview tag: ${tag}"
              gh api -X DELETE "repos/${REPOSITORY}/git/refs/tags/${tag}" 2>/dev/null || true
            done <<< "${LEFTOVER_TAGS}"
          fi
